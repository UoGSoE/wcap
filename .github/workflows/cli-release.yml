name: cli-release

on:
  push:
    tags:
      - 'cli/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.1.0). Leave blank to use `git describe`.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/cli/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cli/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          ext=""
          if [[ "$GOOS" == "windows" ]]; then ext=".exe"; fi
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../wcap-${GOOS}-${GOARCH}${ext}" \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: wcap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wcap-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum wcap-* > SHA256SUMS

      - name: Compute tag + prerelease
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/cli/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${GITHUB_REF#refs/tags/cli/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            tag="cli/${version}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
            tag="cli/${version}"
          fi
          prerelease="${{ inputs.prerelease }}"
          if [[ -z "${prerelease}" && "${version}" == *"-"* ]]; then
            prerelease="true"
          fi
          echo "tag=${tag}"                       >> "$GITHUB_OUTPUT"
          echo "version=${version}"               >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease:-false}"  >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: wcap ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            wcap-*
            SHA256SUMS
